name: Gardina Threads Autopost

on:
  schedule:
    - cron: "15 6 * * *" # 11:15 Asia/Almaty (UTC+5)
    - cron: "23 8 * * *" # 13:23 Asia/Almaty
    - cron: "10 11 * * *" # 16:10 Asia/Almaty
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gardina-threads-autopost
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run autopost
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREADS_SESSION_ID: ${{ secrets.THREADS_SESSION_ID }}
          THREADS_CSRF_TOKEN: ${{ secrets.THREADS_CSRF_TOKEN }}
        run: node scripts/autopost.mjs

      - name: Commit updated post history
        if: always()
        run: |
          git config user.name "gardina-autopost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts-log.json data/health.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Log posts from this run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
